name: Update FamilyHostsBlocker lists

on:
  workflow_dispatch:
  schedule:
    - cron: "37 0 * * *"
  push:
    paths:
      - "domains_manual.txt"
      - "domains_allowlist.txt"
      - "sources_enabled.txt"
      - "sources_disabled.txt"
      - "scripts/update_hosts.py"
      - ".github/workflows/update_hosts.yml"

permissions:
  contents: write

concurrency:
  group: familyhostsblocker-update
  cancel-in-progress: false

jobs:
  update-lists:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build generated lists
        run: python scripts/update_hosts.py

      - name: Show generated file sizes
        run: |
          wc -l domains_auto.txt familyblocker_domains.txt familyblocker_hosts.txt familyblocker_sources_report.tsv

      - name: Commit generated lists
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add domains_auto.txt familyblocker_domains.txt familyblocker_hosts.txt familyblocker_sources_report.tsv
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
          else
            git commit -m "Update FamilyHostsBlocker generated lists"
            git push
          fi
